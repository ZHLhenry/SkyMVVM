[versions]
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.13.0"
activity = "1.12.4"
constraintlayout = "2.2.1"

hilt = "2.60"

lifecycleRuntimeKtx = "2.10.0"
persistentcookiejar = "v1.0.1"
retrofitVersion = "3.0.0"
databindingRuntime = "9.2.1"
skymvvm = "1.2.0"
skymultistatelayout = "1.0.1"
skyBuildLogic = "1.1.3"
chucker = "4.3.1"
moshi = "1.15.2"
gsonfactory = "10.5"
gson = "2.14.0"
xlog = "1.11.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-noop-processor = { group = "com.sky.buildLogic", name = "hilt-noop-processor", version.ref = "skyBuildLogic" }

androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
persistentcookiejar = { module = "com.github.franmontiel:PersistentCookieJar", version.ref = "persistentcookiejar" }
retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofitVersion" }
androidx-databinding-runtime = { group = "androidx.databinding", name = "databinding-runtime", version.ref = "databindingRuntime" }

okhttp-chucker = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
okhttp-chucker-release = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }

moshi = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
moshi-converter = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofitVersion" }
gsonfactory = { module = "com.github.getActivity:GsonFactory", version.ref = "gsonfactory" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
xlog = { module = "com.elvishew:xlog", version.ref = "xlog" }

skymvvm = { module = "com.sky.lib:SkyMVVM", version.ref = "skymvvm" }
skymultistatelayout = { module = "com.sky.lib:SkyMultiStateLayout", version.ref = "skymultistatelayout" }

[plugins]
sky-android-application = { id = "sky.android.application", version.ref = "skyBuildLogic" }
sky-android-application-flavors = { id = "sky.android.application.flavors", version.ref = "skyBuildLogic" }
sky-android-library = { id = "sky.android.library", version.ref = "skyBuildLogic" }
sky-android-library-common = { id = "sky.android.library.common", version.ref = "skyBuildLogic" }
sky-android-hilt = { id = "sky.android.hilt", version.ref = "skyBuildLogic" }
sky-android-publish = { id = "sky.android.publish", version.ref = "skyBuildLogic" }

